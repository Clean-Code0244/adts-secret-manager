plugins {
	id 'java-library'
	id 'org.springframework.boot' version '3.4.0' apply false
	id 'io.spring.dependency-management' version '1.1.6'
	id "com.vanniktech.maven.publish" version "0.29.0"
}

group = 'io.github.clean-code0244'

version = '2.0.1'

java {
	sourceCompatibility = '17'
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.boot:spring-boot-dependencies:3.4.0"
	}
}

dependencies {
	implementation 'org.springframework:spring-context:6.0.0'

	api('com.cyberark.conjur.api:conjur-api:3.0.5') {
		exclude group: 'org.glassfish.jersey.media', module: 'jersey-media-json-binding'
	}

	implementation 'org.glassfish.jersey.media:jersey-media-json-jackson:3.1.5'

	implementation 'javax.xml.bind:jaxb-api:2.3.1'
	implementation 'org.glassfish.jaxb:jaxb-runtime:2.3.1'

	implementation 'org.slf4j:slf4j-api'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('jar') {
	enabled = true
	archiveClassifier.set('')
}

import com.vanniktech.maven.publish.SonatypeHost

mavenPublishing {

	coordinates("io.github.clean-code0244", "adts-secret-manager", "2.0.1")

	pom {
		name = "ADTS Secret Manager"
		description = "Spring Framework library for CyberArk Conjur integration (Universal)"
		url = "https://github.com/Clean-Code0244/adts-secret-manager"
		inceptionYear = "2024"

		licenses {
			license {
				name = "The Apache License, Version 2.0"
				url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
				distribution = "repo"
			}
		}

		developers {
			developer {
				id = "Clean-Code0244"
				name = "Clean-Code0244"
				email = "tursunyusufomer@gmail.com"
			}
		}

		scm {
			url = "https://github.com/Clean-Code0244/adts-secret-manager"
			connection = "scm:git:git://github.com/Clean-Code0244/adts-secret-manager.git"
			developerConnection = "scm:git:ssh://github.com/Clean-Code0244/adts-secret-manager.git"
		}
	}

	publishToMavenCentral(SonatypeHost.CENTRAL_PORTAL)

	signAllPublications()
}

tasks.named('test') {
	useJUnitPlatform()
}